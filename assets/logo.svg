<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Cyan to Purple Gradient for Mantra & Magic -->
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group for Geek Face Icon -->
  <g transform="translate(400, 260)">
    <!-- Hair Spikes -->
    <path d="M -110,-50 C -120,-110 -70,-180 10,-190 C 20,-170 30,-140 25,-120 C 60,-170 120,-160 140,-110 C 150,-90 145,-70 135,-50 C 170,-70 210,-40 195,10 C 180,45 150,60 120,65 C 100,68 80,65 60,60 C 40,75 10,80 -20,75 C -70,65 -110,40 -125,0 C -135,-25 -125,-40 -110,-50 Z" 
          fill="#ffffff" />

    <!-- Sparkle Star on Top Right Hair -->
    <path d="M 180,-140 Q 180,-100 220,-100 Q 180,-100 180,-60 Q 180,-100 140,-100 Q 180,-100 180,-140 Z" 
          fill="url(#magicGrad)" filter="url(#starGlow)" />

    <!-- Glasses Frame -->
    <!-- Left Rim -->
    <path d="M -130,-10 C -130,-45 -90,-65 -45,-65 C 0,-65 20,-45 20,-10 C 20,25 -5,45 -45,45 C -90,45 -130,25 -130,-10 Z" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
    <!-- Right Rim -->
    <path d="M 25,-10 C 25,-45 65,-65 110,-65 C 155,-65 175,-45 175,-10 C 175,25 150,45 110,45 C 65,45 25,25 25,-10 Z" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
    <!-- Glasses Bridge -->
    <path d="M 15,-20 Q 22.5,-30 30,-20" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Left Temple -->
    <path d="M -130,-20 L -155,-25" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Right Temple -->
    <path d="M 175,-20 L 200,-25" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Smiling Happy Eyes Behind Glasses -->
    <!-- Left Eye Arc -->
    <path d="M -75,-10 Q -45,-38 -15,-10" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Right Eye Arc -->
    <path d="M 80,-10 Q 110,-38 140,-10" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Smile / Cute Chin Smile -->
    <path d="M 15,85 Q 47,110 80,85" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Typography: GeekMantra AI -->
  <g transform="translate(400, 560)" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif">
    <text font-size="82" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">Geek</tspan>
      <tspan fill="url(#magicGrad)">Mantra</tspan>
      <tspan fill="#ffffff"> AI</tspan>
    </text>

    <!-- Subtitle: WHERE GEEKS CREATE MAGIC WITH AI -->
    <text y="70" font-size="24" font-weight="800" letter-spacing="9" fill="#94a3b8">
      WHERE GEEKS CREATE <tspan fill="#00f0ff">MAGIC</tspan> WITH AI
    </text>
  </g>
</svg>

